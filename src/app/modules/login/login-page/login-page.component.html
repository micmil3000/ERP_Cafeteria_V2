<main class="login">
  <!-- Sección principal del inicio de sesión -->
  <section class="login__panel" aria-labelledby="login-title">
    <!-- Encabezado de la cafetería -->
    <header class="login__brand">
      <span class="login__logo" aria-hidden="true"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4Z M17 10h2a3 3 0 0 1 0 6h-2 M8 3v2 M12 2v3 M3 22h15" /></svg></span>
      <h1 class="login__title" id="login-title">Savia Café</h1>
      <p class="login__subtitle">Sistema de gestión</p>
    </header>
    <h2 class="login__welcome">Un buen día comienza aquí.</h2>
    <p class="login__description">Ingresa tus datos para continuar.</p>
    <!-- Formulario para iniciar sesión -->
    <app-login-form [error]="error" (submitLogin)="login($event)" />
  </section>
</main>
