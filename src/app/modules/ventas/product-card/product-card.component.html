<article class="product-card" [class.product-card--sold-out]="product().stock === 0">
	<!-- Imagen o ilustración del producto -->
	<div
		class="product-card__image-wrapper"
		[class.product-card__image-wrapper--warm]="
			product().categoria === 'Panadería' ||
			product().categoria === 'Postres'
		"
	>
		@if (product().imagen && failedImage !== product().imagen) {
			<img
				class="product-card__image"
				[src]="product().imagen"
				[alt]="product().nombre"
				loading="lazy"
				(error)="failedImage = product().imagen"
			/>
		} @else {
			<div class="product-card__illustration-wrapper">
				<svg
          class="product-card__illustration"
          viewBox="0 0 24 24"
          role="img"
          [attr.aria-label]="product().nombre + ', ilustración'"
        >
          @if (product().categoria === 'Panadería') {
            <!-- Pan -->
            <path d="M5 15C5 10.5 7.7 7 12 7C16.3 7 19 10.5 19 15C19 17.2 17.2 19 15 19H9C6.8 19 5 17.2 5 15Z" />
            <path d="M9 8.2C10 10.2 10 12.8 9 15" />
            <path d="M12 7V16" />
            <path d="M15 8.2C14 10.2 14 12.8 15 15" />
          } @else if (product().categoria === 'Postres') {
            <!-- Cake Slice -->
            <path d="M16 13H3" />
            <path d="M16 17H3" />
            <path d="m7.2 7.9-3.388 2.5A2 2 0 0 0 3 12.01V20a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-8.654c0-2-2.44-6.026-6.44-8.026a1 1 0 0 0-1.082.057L10.4 5.6" />
            <circle cx="9" cy="7" r="2" />
          } @else {
            <!-- Taza de café -->
            <path d="M5 8H16V14C16 17.3 13.3 20 10 20C6.7 20 5 17.3 5 14Z" />
            <path d="M16 10H18C20.2 10 21 11.5 21 13C21 14.5 20.2 16 18 16H16" />
            <path d="M8 5C7 4 9 3 8 2" />
            <path d="M12 5C11 4 13 3 12 2" />
          }
        </svg>
			</div>
		}

		<span class="product-card__badge">
			<app-badge
				[text]="availability.text"
				[variant]="availability.variant"
			/>
		</span>
	</div>

	<!-- Información y acción del producto -->
	<div class="product-card__body">
		<p class="product-card__category">
			{{ product().categoria }}
		</p>

		<h3 class="product-card__name">
			{{ product().nombre }}
		</h3>

		<p class="product-card__price">
			{{ money(product().precio) }}

			<span class="product-card__tax">
				+ IVA
			</span>
		</p>

		<p class="product-card__stock">
			{{ product().stock }} disponibles
		</p>

		<button
			class="product-card__action"
			type="button"
			[disabled]="product().stock === 0"
			(click)="addProduct()"
			[attr.aria-label]="'Agregar ' + product().nombre"
		>
			{{ product().stock === 0 ? 'Agotado' : '+ Agregar' }}
		</button>
	</div>
</article>
