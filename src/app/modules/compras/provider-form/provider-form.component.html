<form class="provider-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="provider-form__field">
    <label class="provider-form__label" for="provider-name">Nombre</label>
    <input class="provider-form__input" id="provider-name" type="text" formControlName="nombre" required [attr.aria-invalid]="invalid('nombre')" aria-describedby="provider-name-error" />
    <span class="provider-form__error" id="provider-name-error">@if (invalid('nombre')) { Escribe el nombre del proveedor. }</span>
  </div>
  <div class="provider-form__field">
    <label class="provider-form__label" for="provider-contact">Contacto</label>
    <input class="provider-form__input" id="provider-contact" type="text" formControlName="contacto" required [attr.aria-invalid]="invalid('contacto')" aria-describedby="provider-contact-error" />
    <span class="provider-form__error" id="provider-contact-error">@if (invalid('contacto')) { Escribe el nombre del contacto. }</span>
  </div>
  <div class="provider-form__field">
    <label class="provider-form__label" for="provider-phone">Teléfono</label>
    <input class="provider-form__input" id="provider-phone" type="tel" formControlName="telefono" required [attr.aria-invalid]="invalid('telefono')" aria-describedby="provider-phone-error" />
    <span class="provider-form__error" id="provider-phone-error">@if (invalid('telefono')) { Escribe un teléfono. }</span>
  </div>
  <div class="provider-form__field">
    <label class="provider-form__label" for="provider-email">Correo</label>
    <input class="provider-form__input" id="provider-email" type="email" formControlName="correo" required [attr.aria-invalid]="invalid('correo')" aria-describedby="provider-email-error" />
    <span class="provider-form__error" id="provider-email-error">@if (invalid('correo')) { Escribe un correo válido. }</span>
  </div>
  <div class="provider-form__field">
    <label class="provider-form__label" for="provider-address">Dirección</label>
    <textarea class="provider-form__input" id="provider-address" rows="2" formControlName="direccion" required [attr.aria-invalid]="invalid('direccion')" aria-describedby="provider-address-error"></textarea>
    <span class="provider-form__error" id="provider-address-error">@if (invalid('direccion')) { Escribe la dirección. }</span>
  </div>
  <footer class="provider-form__actions">
    <button class="provider-form__button provider-form__button--secondary" type="button" (click)="cancel.emit()">Cancelar</button>
    <button class="provider-form__button" type="submit">{{ mode() === 'CREATE' ? 'Registrar proveedor' : 'Guardar cambios' }}</button>
  </footer>
</form>
