<app-modal class="confirm-dialog" [open]="open()" [title]="title()" (close)="cancel.emit()">
  <div class="confirm-dialog__content">
    <p class="confirm-dialog__message">{{ message() }}</p>
  </div>
  <div modal-footer class="confirm-dialog__actions">
    <button type="button" class="confirm-dialog__button confirm-dialog__button--cancel" (click)="cancel.emit()">Cancelar</button>
    <button type="button" class="confirm-dialog__button confirm-dialog__button--confirm"
      [class.confirm-dialog__button--danger]="variant() === 'danger'" (click)="confirm.emit()">{{ confirmText() }}</button>
  </div>
</app-modal>
