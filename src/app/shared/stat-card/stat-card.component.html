<article class="stat-card">
  <!-- Encabezado de la tarjeta de estadísticas -->
  <header class="stat-card__header">
    <span class="stat-card__label">{{ label() }}</span>
    <span class="stat-card__icon" aria-hidden="true"><ng-content select="[stat-card-icon]" /></span>
  </header>
  <!-- Contenido de la tarjeta de estadísticas -->
  <div class="stat-card__content">
    <p class="stat-card__value">{{ value() }}</p>
    <!-- Validar si existe un detalle para mostrarlo -->
    @if (detail()) {
      <p class="stat-card__detail">{{ detail() }}</p>
    }
  </div>
</article>
