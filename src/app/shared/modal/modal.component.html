<!-- Modal -->
<dialog #dialog class="modal" [attr.aria-label]="title() || 'Diálogo'" aria-modal="true"
  (cancel)="requestClose($event)">
  <!-- Contenedor del modal -->
  <div class="modal__container">
    <!-- Encabezado del modal, con el título y el botón de cierre -->
    <header class="modal__header">
      <h2 class="modal__title">{{ title() }}</h2>
      <button class="modal__close" type="button" aria-label="Cerrar diálogo" (click)="requestClose()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <path d="m6 6 12 12M6 18 18 6" />
        </svg>
      </button>
    </header>
    <!-- Contenido del modal cargado dinámicamente -->
    <div class="modal__body"><ng-content /></div>
    <!-- Pie de página del modal, con contenido reci -->
    <footer class="modal__footer"><ng-content select="[modal-footer]" /></footer>
  </div>
</dialog>
